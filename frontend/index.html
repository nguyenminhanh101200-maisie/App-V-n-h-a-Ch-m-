<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Đã xóa nút tải database thủ công -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchForm('login')">Đăng nhập</button>
        <button class="tab-btn" onclick="switchForm('register')">Đăng ký</button>
    </div>

    <!-- Form Đăng Nhập -->
    <form id="loginForm" class="active" onsubmit="return handleLogin(event)">
        <div class="input-group">
            <label>Email</label>
            <input type="text" id="loginEmail" placeholder="example@gmail.com">
            <p class="error-msg" id="loginEmailError">Email không hợp lệ.</p>
        </div>
        <div class="input-group">
            <label>Mật khẩu</label>
            <div class="password-wrapper">
                <input type="password" id="loginPass" placeholder="••••••••">
                <button type="button" class="toggle-password" onclick="togglePassword('loginPass', this)" aria-label="Hiện mật khẩu">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p class="error-msg" id="loginPassError">Mật khẩu có ít nhất 8 kí tự.</p>
        </div>
        <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>

    <!-- Form Đăng Ký -->
    <form id="registerForm" onsubmit="return handleRegister(event)">
        <div class="input-group">
            <label>Email</label>
            <input type="text" id="regEmail" placeholder="yourname@gmail.com">
            <p class="error-msg" id="regEmailError">Email không hợp lệ.</p>
        </div>
        <div class="input-group">
            <label>Mật khẩu</label>
            <div class="password-wrapper">
                <input type="password" id="regPass" placeholder="Tối thiểu 8 ký tự">
                <button type="button" class="toggle-password" onclick="togglePassword('regPass', this)" aria-label="Hiện mật khẩu">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p class="error-msg" id="regPassError">Mật khẩu có ít nhất 8 ký tự.</p>
        </div>
        <button type="submit" class="btn-submit">Tạo tài khoản</button>
    </form>
</div>

<script>
    function isEmail(email) {
        return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email);
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
            btn.setAttribute('aria-label', 'Ẩn mật khẩu');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
            btn.setAttribute('aria-label', 'Hiện mật khẩu');
        }
    }

    function switchForm(type) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (type === 'login' && idx === 0) || (type === 'register' && idx === 1));
        });
        document.getElementById('loginForm').classList.toggle('active', type === 'login');
        document.getElementById('registerForm').classList.toggle('active', type === 'register');
    }

    async function handleRegister(event) {
        event.preventDefault();
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPass').value;
        const emailErr = document.getElementById('regEmailError');
        const passErr = document.getElementById('regPassError');

        let isValid = true;
        if (!isEmail(email)) { emailErr.style.display = 'block'; isValid = false; } 
        else { emailErr.style.display = 'none'; }
        if (pass.length < 8) { passErr.style.display = 'block'; isValid = false; } 
        else { passErr.style.display = 'none'; }
        if (!isValid) return false;

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass })
            });
            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                localStorage.setItem('tempUserId', data.userId);
                window.location.href = '/profile.html';
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('Không thể kết nối đến server. Hãy chắc chắn bạn đã chạy "node script.js"');
        }
        return false;
    }

    async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPass').value;
        const emailErr = document.getElementById('loginEmailError');
        const passErr = document.getElementById('loginPassError');

        let isValid = true;
        if (!isEmail(email)) { emailErr.style.display = 'block'; isValid = false; }
        else { emailErr.style.display = 'none'; }
        if (pass.length < 8) { passErr.style.display = 'block'; isValid = false; }
        else { passErr.style.display = 'none'; }
        if (!isValid) return false;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass })
            });
            const data = await response.json();
            if (response.status === 404) {
                alert(data.message);
                switchForm('register');
            } else if (!response.ok) {
                alert(data.message);
            } else {
                alert(data.message);
                if (data.user) {
                    localStorage.setItem('loggedInUser', JSON.stringify({
                        user_id: data.user.user_id,
                        name: data.user.username,
                        avatar: data.user.avatar_url || "https://i.pravatar.cc/150?img=47"
                    }));
                }
                window.location.href = '/dashboard/index.html';
            }
        } catch (err) {
            alert('Không thể kết nối đến server.');
        }
        return false;
    }

    document.getElementById('registerForm').onsubmit = handleRegister;
    document.getElementById('loginForm').onsubmit = handleLogin;
</script>
</body>
</html>
